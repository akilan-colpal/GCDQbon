# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: adobeform
type: application
framework:
  name: SAPUI5
  version: 1.147.2
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
        excludePatterns:
          - /Component-preload.js
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: backend/
            url: https://eaeae0ff-9ca5-4323-b47d-ab81f7338371.abap.us10.hana.ondemand.com
            destination: BTP_2_RAP_USER_TOKEN
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/Z_ADOBE_SERVICE
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sapadmin/odata/v2
            metadataPath: ./webapp/localService/SuccessFactorService/metadata.xml
            mockdataPath: ./webapp/localService/SuccessFactorService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/Z_BONUSPDF_SERVICE
            metadataPath: ./webapp/localService/Z_BONUSPDF_SERVICE/metadata.xml
            mockdataPath: ./webapp/localService/Z_BONUSPDF_SERVICE/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/Z_BONUSPDF_SERVICE/Z_BONUSPDF_SERVICE_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='Z_BONUSPDF_SERVICE_VAN',Version='0001')/$value/
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
  resources:
    excludes:
      - /test/**
      - /localService/**
