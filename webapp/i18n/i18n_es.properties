# Disclaimer HTML texts
CALCULATION_BASIS_HTML=<strong><em>Base de c\u00E1lculo:</em></strong> <em>Su bono GCD se determina por una combinaci\u00F3n del desempe\u00F1o del negocio (objetivos de ventas/KPIs) y su contribuci\u00F3n individual. El "Pago total" refleja su logro frente a los objetivos trimestrales espec\u00EDficos asignados a su rol y regi\u00F3n.</em>
ELIGIBILITY_PRORATION_HTML=<strong><em>Elegibilidad y prorrateo:</em></strong> <em>Tenga en cuenta que, si se incorpor\u00F3 al plan a mitad de trimestre, cambi\u00F3 de puesto o tom\u00F3 una licencia (LOA), su premio se ha prorrateado. El c\u00E1lculo se basa estrictamente en el n\u00FAmero de d\u00EDas activos en el puesto elegible durante este per\u00EDodo de desempe\u00F1o.</em>
PAYMENT_INFORMATION_HTML=<strong><em>Informaci\u00F3n de pago:</em></strong> <em>El "Premio total" mostrado es un importe bruto (antes de impuestos). Las deducciones legales e impuestos se aplicar\u00E1n en el momento del pago a trav\u00E9s de la n\u00F3mina local. El importe neto se reflejar\u00E1 en su pr\u00F3xima n\u00F3mina de acuerdo con el ciclo de n\u00F3mina local.</em>
OFFICIAL_POLICY_DISCLAIMER_HTML=<strong><em>Pol\u00EDtica oficial y descargo de responsabilidad:</em></strong> <em>Esta informaci\u00F3n se proporciona solo con fines informativos. En caso de cualquier discrepancia entre esta declaraci\u00F3n y las reglas oficiales del plan, prevalecer\u00E1 el Documento del Plan de Bonos GCD. Este premio no constituye una garant\u00EDa de empleo o compensaci\u00F3n futura.</em>
# Note at the bottom
NOTE_GCD_BONUS_PRETAX=Nota: el importe del bono GCD es antes de impuestos (bruto)

