# Disclaimer HTML texts
CALCULATION_BASIS_HTML=<strong><em>Base de C\u00E1lculo:</em></strong> <em>El monto de su bono GCD se determina mediante una combinaci\u00F3n del Desempe\u00F1o del Negocio (Objetivos de Ventas/KPIs) y su contribuci\u00F3n Individual. El "Pago Total" refleja su cumplimiento frente a los objetivos trimestrales espec\u00EDficos asignados a su rol y regi\u00F3n.</em>
ELIGIBILITY_PRORATION_HTML=<strong><em>Elegibilidad y Prorrateo:</em></strong> <em>Tenga en cuenta que si se incorpor\u00F3 al plan a mitad del trimestre, cambi\u00F3 de rol o tuvo una licencia de ausencia (LOA), su bono ha sido prorrateado. El c\u00E1lculo se basa estrictamente en el n\u00FAmero de d\u00EDas activos en el puesto elegible durante este per\u00EDodo de desempe\u00F1o.</em>
PAYMENT_INFORMATION_HTML=<strong><em>Informaci\u00F3n de Pago:</em></strong> <em>El "Bono Total" mostrado es un monto bruto (antes de impuestos). Las deducciones de ley e impuestos se aplicar\u00E1n al momento del pago a trav\u00E9s de su n\u00F3mina local. El monto neto se reflejar\u00E1 en su pr\u00F3ximo recibo de pago de acuerdo con el ciclo de n\u00F3mina local.</em>
OFFICIAL_POLICY_DISCLAIMER_HTML=<strong><em>Pol\u00EDtica Oficial y Aviso Legal:</em></strong> <em>Este estado de cuenta es solo para fines informativos. En caso de cualquier discrepancia entre este estado de cuenta y las reglas oficiales del plan, prevalecer\u00E1 el Documento del Plan de Bonos GCD. Este bono no constituye una garant\u00EDa de empleo o compensaci\u00F3n futura.</em>
# Note at the bottom
NOTE_GCD_BONUS_PRETAX=Nota: El Monto del Bono GCD es Antes de Impuestos (bruto)

