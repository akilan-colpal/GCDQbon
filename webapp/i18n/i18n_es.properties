# Disclaimer HTML texts
CALCULATION_BASIS_HTML=<strong><em>Base de cálculo:</em></strong> <em>Su bono GCD se determina por una combinación del desempeño del negocio (objetivos de ventas/KPIs) y su contribución individual. El "Pago total" refleja su logro frente a los objetivos trimestrales específicos asignados a su rol y región.</em>
ELIGIBILITY_PRORATION_HTML=<strong><em>Elegibilidad y prorrateo:</em></strong> <em>Tenga en cuenta que, si se incorporó al plan a mitad de trimestre, cambió de puesto o tomó una licencia (LOA), su premio se ha prorrateado. El cálculo se basa estrictamente en el número de días activos en el puesto elegible durante este período de desempeño.</em>
PAYMENT_INFORMATION_HTML=<strong><em>Información de pago:</em></strong> <em>El "Premio total" mostrado es un importe bruto (antes de impuestos). Las deducciones legales e impuestos se aplicarán en el momento del pago a través de la nómina local. El importe neto se reflejará en su próxima nómina de acuerdo con el ciclo de nómina local.</em>
OFFICIAL_POLICY_DISCLAIMER_HTML=<strong><em>Política oficial y descargo de responsabilidad:</em></strong> <em>Esta información se proporciona solo con fines informativos. En caso de cualquier discrepancia entre esta declaración y las reglas oficiales del plan, prevalecerá el Documento del Plan de Bonos GCD. Este premio no constituye una garantía de empleo o compensación futura.</em>
NOTE_GCD_BONUS_PRETAX=Nota: el importe del bono GCD es antes de impuestos (bruto)

