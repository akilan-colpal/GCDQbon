# Disclaimer HTML texts
CALCULATION_BASIS_HTML=<strong><em>Calculation Basis:</em></strong> <em>Your GCD Bonus award is determined by a combination of Business Performance (Sales Targets/KPIs) and your Individual contribution. The "Total Payout" reflects your achievement against the specific quarterly targets assigned to your role and region.</em>
ELIGIBILITY_PRORATION_HTML=<strong><em>Eligibility &amp; Pro-ration:</em></strong> <em>Please note that if you joined the plan mid-quarter, changed roles, or took a leave of absence (LOA), your award has been pro-rated. The calculation is based strictly on the number of active days in the eligible position during this performance period.</em>
PAYMENT_INFORMATION_HTML=<strong><em>Payment Information:</em></strong> <em>The "Total Award" displayed is a gross amount (pre-tax). Statutory deductions and taxes will be applied at the time of payment through your local payroll. The net amount will be reflected in your upcoming payslip according to the local payroll cycle.</em>
OFFICIAL_POLICY_DISCLAIMER_HTML=<strong><em>Official Policy &amp; Disclaimer:</em></strong> <em>This statement is for informational purposes only. In the event of any discrepancy between this statement and the official plan rules, the GCD Bonus Plan Document shall prevail. This award does not constitute a guarantee of future employment or compensation.</em>
# Note at the bottom
NOTE_GCD_BONUS_PRETAX=Note: GCD Bonus Amount is Pre-Tax (gross)